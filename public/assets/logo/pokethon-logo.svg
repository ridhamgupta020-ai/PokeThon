<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Pokeball Hex Badge -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal outer frame -->
    <polygon points="40,2 75,22 75,58 40,78 5,58 5,22" fill="#0B2342" stroke="#168BFF" stroke-width="3" />
    
    <!-- Top hemisphere with electric blue glow -->
    <path d="M 12 36 A 28 28 0 0 1 68 36 Z" fill="#168BFF" />
    
    <!-- Bottom hemisphere -->
    <path d="M 12 44 A 28 28 0 0 0 68 44 Z" fill="#06152B" />
    
    <!-- Central dividing band -->
    <rect x="10" y="37" width="60" height="6" fill="#06152B" />
    
    <!-- Center Button Ring & Lightning -->
    <circle cx="40" cy="40" r="12" fill="#06152B" stroke="#FFD83D" stroke-width="3"/>
    <circle cx="40" cy="40" r="6" fill="#FFD83D"/>
    <!-- Small electric spark -->
    <polygon points="40,32 36,41 41,41 39,48 45,39 40,39" fill="#06152B"/>
  </g>

  <!-- Typography: POKE THON -->
  <text x="100" y="58" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#F5F7FC" letter-spacing="-1">
    POKE<tspan fill="#FFD83D">THON</tspan>
  </text>
  
  <!-- Subtitle Tag -->
  <text x="102" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#168BFF" letter-spacing="3">
    24H INNOVATION SPRINT
  </text>
</svg>
